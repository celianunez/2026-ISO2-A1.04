<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Menu · SESCAM Radiodiagnostics</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <header class="topbar">
        <span class="brand">SESCAM Radiodiagnostics</span>
        <span id="app-user" class="user" hidden></span>
        <button id="app-logout" type="button" class="secondary" hidden>Log out</button>
    </header>
    <main class="page">
        <p id="app-status" class="status" role="status" aria-live="polite">Loading…</p>
        <section id="app-menu" aria-labelledby="app-menu-title" hidden>
            <h1 id="app-menu-title">What do you want to do?</h1>
            <ul id="app-entries" class="menu"></ul>
        </section>
    </main>
    <script type="module" src="js/app.js"></script>
</body>
</html>
